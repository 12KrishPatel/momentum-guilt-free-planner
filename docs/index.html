<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

:root{--bg:#090a0f;--bg2:#121521;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.09);--text:#fff;--muted:rgba(255,255,255,.66);--accent:#6366f1;--accent2:#8b5cf6;--ok:#10b981;--ok2:#06b6d4}
@media (prefers-color-scheme: light){:root{--bg:#f6f7fb;--bg2:#eef0f7;--card:#fff;--line:rgba(15,23,42,.1);--text:#0f172a;--muted:#475569}}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--bg),var(--bg2)) fixed;color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

.sub{color:var(--muted);font-size:14px;margin:2px 0 0}

h2{font-size:18px;margin:28px 0 8px}
p{color:var(--muted);margin:0 0 10px}

nav{display:flex;gap:18px;flex-wrap:wrap;margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:14px}
